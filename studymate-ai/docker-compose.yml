# AI Workspace — Docker Compose
# Run: docker compose up
#
# Services:
#  - backend  (FastAPI on port 8000)
#  - frontend (Nginx + React on port 3000)

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ai-workspace-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ai_workspace.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - STORAGE_TYPE=local
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ai-workspace-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
